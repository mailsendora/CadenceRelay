worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=tracking:10m rate=100r/s;

    # Upstream backends
    upstream api_server {
        server server:3001;
    }

    upstream client_app {
        server client:80;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Main server block
    server {
        listen 80;
        server_name _;
        set $senqo_backend_upstream http://senqo-backend:3001;
        set $senqo_frontend_upstream http://senqo-frontend:80;

        # API routes
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional Senqo WhatsApp sidecar (enabled with --profile whatsapp).
        # The prefix keeps Senqo's API isolated from Sendora's /api namespace.
        location /whatsapp-api/ {
            rewrite ^/whatsapp-api/(.*)$ /$1 break;
            proxy_pass $senqo_backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /whatsapp/ {
            rewrite ^/whatsapp/(.*)$ /$1 break;
            proxy_pass $senqo_frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # One-click unsubscribe — must NOT be rate-limited.
        # Mailbox providers POST from a small set of IPs; per-IP throttling
        # would 429 in bursts and Gmail flags the endpoint as broken.
        location ^~ /api/v1/t/u/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tracking endpoints (high throughput)
        location /api/v1/t/ {
            limit_req zone=tracking burst=200 nodelay;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook endpoints (no rate limit - AWS SNS needs it)
        location /api/v1/webhooks/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backup restore - large archives, long processing
        location /api/v1/backup/import {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            client_max_body_size 500m;
        }

        # Client app (React SPA)
        location / {
            proxy_pass http://client_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
