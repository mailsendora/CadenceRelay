services:
  worker:
    profiles: [whatsapp]
    environment:
      SENQO_AUTOMATION_WEBHOOK_URL: ${SENQO_AUTOMATION_WEBHOOK_URL:-http://senqo-backend:3001/api/whatsapp/sendora-action}
      SENQO_AUTOMATION_WEBHOOK_SECRET: ${SENQO_AUTOMATION_WEBHOOK_SECRET:-}

  senqo-migrate:
    profiles: [whatsapp]
    build:
      context: ./senqo
      dockerfile: backend/Dockerfile.migrate
    environment:
      DATABASE_URL: ${SENQO_DATABASE_URL}
      PGOPTIONS: -csearch_path=senqo,public
    command: ["sh", "-c", "npx drizzle-kit migrate --config=drizzle.config.ts || echo 'Senqo SQL migrations already bootstrapped by Sendora'" ]
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    networks: [backend]

  senqo-backend:
    profiles: [whatsapp]
    build:
      context: ./senqo/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${SENQO_DATABASE_URL}
      PGOPTIONS: -csearch_path=senqo,public
      APP_URL: ${SENQO_APP_URL:-http://senqo-backend:3001}
      FRONTEND_URL: ${SENQO_FRONTEND_URL:-http://localhost:8080/whatsapp/}
      JWT_SECRET: ${JWT_SECRET}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_CHAT_LLM: ${OPENAI_CHAT_LLM:-gpt-4o-mini}
      OPENAI_FORMATTER_LLM: ${OPENAI_FORMATTER_LLM:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_CHAT_LLM: ${GROQ_CHAT_LLM:-llama-3.1-8b-instant}
      GROQ_FORMATTER_LLM: ${GROQ_FORMATTER_LLM:-llama-3.1-8b-instant}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-local}
      SMTP_PASS: ${SMTP_PASS:-local}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@localhost}
      WHATSAPP_SERVICE_URL: http://senqo-whatsapp:8080
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY}
      WHATSAPP_WEBHOOK_AUTHORIZATION: ${WHATSAPP_WEBHOOK_AUTHORIZATION}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      WORKSPACE_SECRETS_KEY: ${WORKSPACE_SECRETS_KEY}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-senqo-wa}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      ALLOWED_PRODUCTION_ORIGINS: ${ALLOWED_PRODUCTION_ORIGINS:-localhost}
      SENQO_SSO_SHARED_SECRET: ${SENQO_SSO_SHARED_SECRET}
    depends_on:
      senqo-migrate:
        condition: service_completed_successfully
      senqo-whatsapp:
        condition: service_started
    networks: [backend, frontend]

  senqo-whatsapp:
    profiles: [whatsapp]
    build:
      context: ./senqo/whatsapp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY}
      WHATSAPP_WEBHOOK_AUTHORIZATION: ${WHATSAPP_WEBHOOK_AUTHORIZATION}
      BACKEND_WEBHOOK_URL: http://senqo-backend:3001/api/whatsapp/events
    volumes:
      - ./senqo/whatsapp/sessions:/app/sessions
      - ./senqo/whatsapp/logs:/app/logs
    networks: [backend]

  senqo-frontend:
    profiles: [whatsapp]
    build:
      context: ./senqo/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /whatsapp-api
        VITE_BASE_PATH: /whatsapp/
    restart: unless-stopped
    depends_on:
      - senqo-backend
    networks: [frontend]
